<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Litmus - AI Startup Idea Validator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <header>
      <p class="eyebrow">Milestone 4</p>
      <h1>Litmus</h1>
      <p class="subtitle">
        Describe your startup idea. Three agents run: one searches the live web,
        then a market analyst and a competitor analyst read what it found and
        report back.
      </p>
    </header>

    <!-- The idea submission form -->
    <section class="card">
      <label for="idea">Your startup idea</label>
      <textarea id="idea" rows="4"></textarea>
      <button id="submit">Validate idea</button>
    </section>

    <!-- script.js writes messages here (loading, errors) -->
    <p id="status"></p>

    <!-- script.js builds the result cards inside here -->
    <section id="results"></section>
  </main>

  <script src="script.js"></script>

</body>
</html>
